apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tls-shop
data:
  # Host is "mongodb" (the Service name) so it matches the server cert SAN.
  MONGODB_URI: "mongodb://mongodb:27017/shopdb?tls=true"
  MONGO_TLS_ENABLED: "true"
  MONGO_TLS_TRUSTSTORE: "/etc/tls/truststore.p12"
  MONGO_TLS_TRUSTSTORE_TYPE: "PKCS12"
  MONGO_TLS_ALLOW_INVALID: "false"     # CA validation on, not pinned
  SERVER_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-shop-api
  namespace: tls-shop
  labels: { app: tls-shop-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tls-shop-api }
  template:
    metadata:
      labels: { app: tls-shop-api }
    spec:
      containers:
        - name: api
          image: tls-shop-api:1.0.0
          imagePullPolicy: IfNotPresent      # image is loaded into kind, never pulled
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }   # MONGO_TLS_TRUSTSTORE_PASSWORD
          volumeMounts:
            - name: truststore
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
      volumes:
        - name: truststore
          secret:
            secretName: app-truststore   # CA truststore (the "not pinned" trust anchor)
---
apiVersion: v1
kind: Service
metadata:
  name: tls-shop-api
  namespace: tls-shop
  labels: { app: tls-shop-api }
spec:
  type: NodePort
  selector: { app: tls-shop-api }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30090      # kind maps host:30090 -> this NodePort
      name: http
